name: Build SecureShare APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q SecureShare-Android-Source.zip -d buildsrc

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk SecureShare.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureShare-Android
          path: SecureShare.apk
          retention-days: 7
